<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Bildauswahl Startseite | Papier-Projekt</title>
  <link rel="icon" href="bilder/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/farben.js"></script>
</head>
<body>
  <header class="kopf">
    <div class="inhalt-breite">
      <a class="logo" href="index.html"><img src="bilder/icon.svg" alt="" width="26" height="26">Papier-Projekt</a>
    </div>
  </header>
  <main class="inhalt-breite">
    <h1>Bildauswahl für die Startseite</h1>
    <p class="einleitung">Vorschau-Seite (nicht im Menü verlinkt). Welches Bild soll oben auf die Startseite?</p>
    <div class="raster-2">
      <figure class="karte"><div class="hero-bild"><img src="bilder/hero.svg" width="400" height="300" alt="Option A: Tablet unter einem Papierstapel"></div><figcaption><strong>A – Tablet unter dem Stapel</strong> (jetziges Bild)</figcaption></figure>
      <figure class="karte"><div class="hero-bild"><img src="bilder/hero-waage.svg" width="400" height="300" alt="Option B: Waage, Papier wiegt schwerer als das Tablet"></div><figcaption><strong>B – Die Waage:</strong> Papier wiegt schwerer als das iPad</figcaption></figure>
      <figure class="karte"><div class="hero-bild"><img src="bilder/hero-turm.svg" width="400" height="300" alt="Option C: Papierturm neben dem Schulgebäude, etwa 24 Meter"></div><figcaption><strong>C – Der Papierturm:</strong> ca. 24 m Papier pro Schuljahr neben der Schule</figcaption></figure>
      <figure class="karte"><div class="hero-bild"><img src="bilder/hero-druck.svg" width="400" height="300" alt="Option D: Aus einem Tablet fliegen Blätter wie aus einem Drucker"></div><figcaption><strong>D – Das Tablet als Drucker:</strong> Blätter fliegen aus dem Bildschirm</figcaption></figure>
    </div>
  </main>
</body>
</html>
