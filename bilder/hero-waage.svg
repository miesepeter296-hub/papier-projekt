<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Zeichnung: Eine Waage. Auf der einen Seite liegt ein Tablet, auf der anderen ein hoher Papierstapel, der die Waage nach unten drückt.</title>
  <!-- Selbst erstellte Grafik für das Papier-Projekt -->
  <ellipse cx="200" cy="278" rx="150" ry="12" fill="#c6dfcf"/>
  <!-- Ständer -->
  <rect x="194" y="70" width="12" height="196" rx="4" fill="#26323a"/>
  <path d="M150 272 L250 272 L232 256 L168 256 Z" fill="#26323a"/>
  <circle cx="200" cy="70" r="11" fill="#1e6b47"/>
  <!-- Balken, nach rechts geneigt -->
  <line x1="72.8" y1="43" x2="327.2" y2="97" stroke="#26323a" stroke-width="9" stroke-linecap="round"/>
  <!-- linke Schale (oben) mit Tablet -->
  <g stroke="#53616b" stroke-width="2">
    <line x1="72.8" y1="43" x2="28" y2="123"/><line x1="72.8" y1="43" x2="118" y2="123"/>
    <line x1="327.2" y1="97" x2="282" y2="177"/><line x1="327.2" y1="97" x2="372" y2="177"/>
  </g>
  <path d="M22 123 H124 Q118 142 73 142 Q28 142 22 123 Z" fill="#1d4f8c"/>
  <rect x="45" y="97" width="56" height="26" rx="5" fill="#26323a"/>
  <rect x="50" y="101" width="46" height="18" rx="2" fill="#6fa3dc"/>
  <text x="73" y="162" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4f8c" text-anchor="middle">iPad</text>
  <!-- rechte Schale (unten) mit Papierstapel -->
  <path d="M276 177 H378 Q372 196 327 196 Q282 196 276 177 Z" fill="#1e6b47"/>
  <g stroke="#9fb3a7" stroke-width="2" fill="#ffffff">
    <rect x="287" y="159" width="80" height="18" rx="2"/>
    <rect x="285" y="141" width="80" height="18" rx="2" fill="#f3f6f4"/>
    <rect x="289" y="123" width="80" height="18" rx="2"/>
    <rect x="286" y="105" width="80" height="18" rx="2" fill="#f3f6f4"/>
    <rect x="288" y="87" width="80" height="18" rx="2" transform="rotate(-3 328 96)"/>
    <rect x="292" y="62" width="62" height="24" rx="2" transform="rotate(8 323 74)"/>
  </g>
  <text x="327" y="216" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#134a31" text-anchor="middle">Papier</text>
</svg>
