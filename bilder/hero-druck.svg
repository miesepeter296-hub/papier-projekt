<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Zeichnung: Aus dem Bildschirm eines Tablets fliegen viele Blätter Papier heraus, als wäre es ein Drucker.</title>
  <!-- Selbst erstellte Grafik für das Papier-Projekt -->
  <ellipse cx="200" cy="282" rx="160" ry="12" fill="#c6dfcf"/>
  <!-- Tablet aufrecht -->
  <rect x="125" y="140" width="150" height="132" rx="16" fill="#26323a"/>
  <rect x="137" y="152" width="126" height="108" rx="6" fill="#6fa3dc"/>
  <!-- „Schlitz“ oben im Bildschirm -->
  <rect x="150" y="158" width="100" height="8" rx="4" fill="#1d4f8c"/>
  <!-- Blätter, die herausfliegen -->
  <g stroke="#9fb3a7" stroke-width="2">
    <g transform="rotate(-4 200 120)"><rect x="160" y="96" width="80" height="66" rx="3" fill="#ffffff"/><rect x="170" y="108" width="44" height="6" rx="3" fill="#1e6b47" stroke="none"/><rect x="170" y="122" width="58" height="4" rx="2" fill="#b8c7be" stroke="none"/><rect x="170" y="132" width="50" height="4" rx="2" fill="#b8c7be" stroke="none"/></g>
    <g transform="rotate(-24 120 80)"><rect x="88" y="52" width="64" height="54" rx="3" fill="#ffffff"/><rect x="96" y="62" width="34" height="5" rx="2.5" fill="#1e6b47" stroke="none"/><rect x="96" y="74" width="46" height="4" rx="2" fill="#b8c7be" stroke="none"/></g>
    <g transform="rotate(20 285 70)"><rect x="252" y="42" width="64" height="54" rx="3" fill="#ffffff"/><rect x="260" y="52" width="34" height="5" rx="2.5" fill="#1d4f8c" stroke="none"/><rect x="260" y="64" width="46" height="4" rx="2" fill="#b8c7be" stroke="none"/></g>
    <g transform="rotate(-40 55 150)"><rect x="30" y="128" width="50" height="42" rx="3" fill="#f3f6f4"/></g>
    <g transform="rotate(35 345 150)"><rect x="320" y="128" width="50" height="42" rx="3" fill="#f3f6f4"/></g>
    <g transform="rotate(-12 190 30)"><rect x="168" y="12" width="44" height="36" rx="3" fill="#ffffff"/></g>
    <g transform="rotate(50 70 245)"><rect x="50" y="228" width="44" height="34" rx="3" fill="#ffffff"/></g>
    <g transform="rotate(-30 330 245)"><rect x="306" y="228" width="44" height="34" rx="3" fill="#ffffff"/></g>
  </g>
  <!-- Bewegungslinien -->
  <g stroke="#1e6b47" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="150" y1="92" x2="138" y2="80"/><line x1="250" y1="92" x2="262" y2="80"/><line x1="200" y1="86" x2="200" y2="70"/>
  </g>
</svg>
