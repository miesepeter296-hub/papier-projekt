<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t">
  <title id="t">Zeichnung: zwei große Papiercontainer mit vier Rädern, randvoll mit Papier</title>
  <!-- Selbst erstellte Grafik für das Papier-Projekt. Platzhalter, bis ein eigenes Foto da ist. -->
  <rect width="480" height="300" fill="#e3f1e8"/>
  <rect y="262" width="480" height="38" fill="#c6dfcf"/>
  <g id="tonne">
    <!-- Papier, das oben herausquillt -->
    <g stroke="#9fb3a7" stroke-width="2">
      <rect x="44" y="70" width="60" height="44" rx="3" fill="#ffffff" transform="rotate(-14 74 92)"/>
      <rect x="96" y="62" width="64" height="48" rx="3" fill="#f3f6f4" transform="rotate(9 128 86)"/>
      <rect x="150" y="70" width="58" height="44" rx="3" fill="#ffffff" transform="rotate(-6 179 92)"/>
      <rect x="70" y="80" width="120" height="30" rx="3" fill="#ffffff"/>
    </g>
    <!-- Container -->
    <path d="M30 104 H220 L208 244 H42 Z" fill="#1d4f8c"/>
    <rect x="24" y="96" width="202" height="16" rx="6" fill="#163e6e"/>
    <rect x="60" y="140" width="130" height="34" rx="6" fill="#ffffff"/>
    <text x="125" y="164" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4f8c" text-anchor="middle">PAPIER</text>
    <rect x="44" y="244" width="162" height="8" rx="3" fill="#163e6e"/>
    <circle cx="62" cy="262" r="11" fill="#26323a"/>
    <circle cx="110" cy="262" r="11" fill="#26323a"/>
    <circle cx="140" cy="262" r="11" fill="#26323a"/>
    <circle cx="188" cy="262" r="11" fill="#26323a"/>
  </g>
  <use href="#tonne" x="230"/>
</svg>
