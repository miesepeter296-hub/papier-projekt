<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Zeichnung: Neben einem Schulgebäude ragt ein riesiger Papierturm in den Himmel, beschriftet mit etwa 24 Metern Papier pro Schuljahr.</title>
  <!-- Selbst erstellte Grafik für das Papier-Projekt -->
  <rect width="400" height="300" fill="#e4eef9"/>
  <circle cx="60" cy="55" r="22" fill="#ffd36b"/>
  <rect y="262" width="400" height="38" fill="#c6dfcf"/>
  <!-- Schulgebäude -->
  <rect x="30" y="168" width="150" height="94" fill="#c9774a"/>
  <path d="M22 170 L105 128 L188 170 Z" fill="#8a3b12"/>
  <g fill="#ffffff">
    <rect x="44" y="182" width="22" height="18" rx="2"/><rect x="76" y="182" width="22" height="18" rx="2"/>
    <rect x="112" y="182" width="22" height="18" rx="2"/><rect x="144" y="182" width="22" height="18" rx="2"/>
    <rect x="44" y="214" width="22" height="18" rx="2"/><rect x="144" y="214" width="22" height="18" rx="2"/>
    <rect x="76" y="214" width="22" height="18" rx="2"/><rect x="112" y="214" width="22" height="18" rx="2"/>
  </g>
  <rect x="94" y="236" width="22" height="26" fill="#5a2a10"/>
  <!-- Papierturm -->
  <g stroke="#9fb3a7" stroke-width="1.5">
    <rect x="236" y="34" width="84" height="228" fill="#ffffff"/>
  </g>
  <g stroke="#d5dfd8" stroke-width="1.5">
    <line x1="236" y1="52" x2="320" y2="52"/><line x1="236" y1="70" x2="320" y2="70"/><line x1="236" y1="88" x2="320" y2="88"/>
    <line x1="236" y1="106" x2="320" y2="106"/><line x1="236" y1="124" x2="320" y2="124"/><line x1="236" y1="142" x2="320" y2="142"/>
    <line x1="236" y1="160" x2="320" y2="160"/><line x1="236" y1="178" x2="320" y2="178"/><line x1="236" y1="196" x2="320" y2="196"/>
    <line x1="236" y1="214" x2="320" y2="214"/><line x1="236" y1="232" x2="320" y2="232"/><line x1="236" y1="250" x2="320" y2="250"/>
  </g>
  <rect x="244" y="18" width="70" height="18" rx="2" fill="#f3f6f4" stroke="#9fb3a7" stroke-width="1.5" transform="rotate(-6 279 27)"/>
  <!-- Maßpfeil -->
  <g stroke="#134a31" stroke-width="2.5" fill="none">
    <line x1="345" y1="22" x2="345" y2="260"/>
    <path d="M338 32 L345 20 L352 32"/><path d="M338 250 L345 262 L352 250"/>
  </g>
  <rect x="322" y="126" width="72" height="40" rx="8" fill="#1e6b47"/>
  <text x="358" y="144" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">≈ 24 m</text>
  <text x="358" y="160" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">pro Schuljahr</text>
</svg>
