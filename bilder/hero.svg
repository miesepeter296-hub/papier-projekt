<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Zeichnung: Ein Tablet liegt halb unter einem hohen Stapel Arbeitsblätter</title>
  <!-- Selbst erstellte Grafik für das Papier-Projekt -->
  <ellipse cx="200" cy="270" rx="170" ry="16" fill="#c6dfcf"/>
  <!-- Tablet -->
  <g transform="rotate(-8 140 200)">
    <rect x="40" y="120" width="190" height="140" rx="16" fill="#26323a"/>
    <rect x="52" y="132" width="166" height="116" rx="6" fill="#6fa3dc"/>
    <circle cx="224" cy="190" r="3" fill="#53616b"/>
    <rect x="66" y="148" width="90" height="10" rx="5" fill="#ffffff" opacity="0.85"/>
    <rect x="66" y="168" width="130" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="66" y="184" width="110" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
  </g>
  <!-- Papierstapel -->
  <g stroke="#9fb3a7" stroke-width="2">
    <rect x="150" y="226" width="170" height="40" rx="3" fill="#ffffff" transform="rotate(2 235 246)"/>
    <rect x="146" y="204" width="170" height="26" rx="3" fill="#f3f6f4" transform="rotate(-3 231 217)"/>
    <rect x="154" y="182" width="170" height="26" rx="3" fill="#ffffff" transform="rotate(4 239 195)"/>
    <rect x="148" y="160" width="170" height="26" rx="3" fill="#f3f6f4" transform="rotate(-2 233 173)"/>
    <rect x="156" y="138" width="170" height="26" rx="3" fill="#ffffff" transform="rotate(3 241 151)"/>
    <rect x="150" y="116" width="170" height="26" rx="3" fill="#f3f6f4" transform="rotate(-4 235 129)"/>
  </g>
  <!-- Oberstes Blatt mit Textzeilen -->
  <g transform="rotate(-10 250 70)">
    <rect x="180" y="20" width="130" height="100" rx="4" fill="#ffffff" stroke="#9fb3a7" stroke-width="2"/>
    <rect x="196" y="36" width="70" height="8" rx="4" fill="#1e6b47"/>
    <rect x="196" y="54" width="98" height="5" rx="2.5" fill="#b8c7be"/>
    <rect x="196" y="66" width="90" height="5" rx="2.5" fill="#b8c7be"/>
    <rect x="196" y="78" width="98" height="5" rx="2.5" fill="#b8c7be"/>
    <rect x="196" y="90" width="60" height="5" rx="2.5" fill="#b8c7be"/>
  </g>
  <!-- Fliegendes Blatt -->
  <g transform="rotate(18 345 60)">
    <rect x="320" y="30" width="54" height="70" rx="3" fill="#ffffff" stroke="#9fb3a7" stroke-width="2"/>
    <rect x="328" y="42" width="34" height="4" rx="2" fill="#b8c7be"/>
    <rect x="328" y="52" width="38" height="4" rx="2" fill="#b8c7be"/>
    <rect x="328" y="62" width="30" height="4" rx="2" fill="#b8c7be"/>
  </g>
</svg>
